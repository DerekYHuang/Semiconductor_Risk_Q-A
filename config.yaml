# Central config — every script reads from here so you only change settings in one place.

paths:
  raw_data: "data/raw"
  processed_chunks: "data/processed/chunks/chunks.jsonl"
  vector_store: "data/processed/vector_store"
  eval_set: "data/eval/eval_set.jsonl"
  eval_results: "outputs/eval_results"

chunking:
  chunk_size_tokens: 400      # starting point — tune this against eval results (see README section 4)
  chunk_overlap_tokens: 60
  # try 200/40 and 600/80 as comparison points during iteration

embedding:
  model_name: "BAAI/bge-small-en-v1.5"
  # alternative to try during iteration: "sentence-transformers/all-MiniLM-L6-v2" (faster, smaller)

retrieval:
  top_k: 5
  # try 3 and 8 as comparison points during iteration

llm:
  provider: "ollama"
  model_name: "llama3.2:3b"   # alternative: "phi3:mini"
  temperature: 0.1             # keep low — this is a factual QA system, not creative writing

finetune:
  base_model: "meta-llama/Llama-3.2-3B-Instruct"   # must match the Ollama model family you evaluate against
  lora_rank: 8
  lora_alpha: 16
  learning_rate: 0.0002
  epochs: 3
  output_dir: "outputs/finetuned_model"
